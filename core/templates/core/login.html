<!DOCTYPE html>

<html lang="en"> 
    <head>     
        <meta charset="UTF-8">     
        <meta name="viewport" content="width=device-width, initial-scale=1.0">     
        <title>Admin Login | Taxi Booking System\</title>     
        <style>
        form{             
            box-sizing: border-box;         
        }

            body {
                margin: 0;
                min-height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;
                background: #f3f4f6;
                font-family: Arial, sans-serif;
            }

            .login-container {
                width: 360px;
                padding: 35px;
                background: white;
                border-radius: 10px;
                box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            }

            h2 {
                text-align: center;
                margin-bottom: 8px;
                color: #1f2937;
            }

            p {
                text-align: center;
                color: #6b7280;
                margin-bottom: 25px;
            }

            input {
                width: 100%;
                padding: 12px;
                margin-bottom: 16px;
                border: 1px solid #d1d5db;
                border-radius: 6px;
            }

            button {
                width: 100%;
                padding: 12px;
                background: #2563eb;
                color: white;
                border: none;
                border-radius: 6px;
                cursor: pointer;
            }

            button:hover {
                background: #1d4ed8;
            }

            .error {
                color: #dc2626;
                text-align: center;
            }
        </style>
    </head> 
<body>

<div class="login-container">
    <h2>Admin Login</h2>
    <p>Taxi Booking System</p>

    {% for message in messages %}
        <div class="error">{{ message }}</div>
    {% endfor %}

    <form method="POST">
        {% csrf_token %}

        <input type="text" name="username"
               placeholder="Enter Username" required>

        <input type="password" name="password"
               placeholder="Enter Password" required>

        <button type="submit">Login</button>
        <a href="{% url 'forgot_password' %}">Forgot Password?</a>
    </form>
</div>

</body> 
</html>
